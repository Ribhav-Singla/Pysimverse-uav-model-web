<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"VIRGIL" TEXT GENERATOR</title>
    <style>
        @font-face {
            font-family: 'Excalifont';
            src: url('Excalifont-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #f5f5f5;
            --text-color: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* The Container for the Preview */
        .canvas-container {
            background-color: white;
            padding: 40px 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border: 1px solid #ddd;
            max-width: 90%;
            text-align: center;
        }

        /* The "Virgil" Text Style */
        #virgil-output {
            font-family: 'Excalifont', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 4rem;
            text-transform: none;
            letter-spacing: -1px;
            color: var(--text-color);
            word-break: break-word;
            line-height: 1.1;
        }

        /* Input Area Styling */
        .controls {
            display: flex;
            gap: 10px;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #000;
            background: transparent;
            font-family: inherit;
            font-weight: bold;
            text-align: center;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #aaa;
            font-weight: normal;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        #btn-copy {
            background-color: #000;
            color: #fff;
        }

        #btn-download {
            background-color: #e63d2f; /* Off-White Zip Tie Red/Orange */
            color: #fff;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #888;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            #virgil-output {
                font-size: 2.5rem;
            }
            .canvas-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="canvas-container" id="capture-area">
        <div id="virgil-output">TEXT</div>
    </div>

    <div class="controls">
        <input type="text" id="user-input" placeholder="TYPE HERE..." autocomplete="off">
        
        <div class="btn-group">
            <button id="btn-copy">COPY TEXT</button>
            </div>
    </div>

    <div class="footer">
        c/o GEMINI "GENERATOR" 2025
    </div>

    <script>
        const input = document.getElementById('user-input');
        const output = document.getElementById('virgil-output');
        const copyBtn = document.getElementById('btn-copy');

        // 1. Real-time text conversion
        input.addEventListener('input', (e) => {
            const val = e.target.value;
            
            if (val.trim() === "") {
                output.innerHTML = `TEXT`;
            } else {
                // Preserve original case and handle special formatting
                output.innerHTML = `${val}`;
            }
        });

        // 2. Copy to Clipboard functionality
        copyBtn.addEventListener('click', () => {
            const textToCopy = output.innerText;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "COPIED!";
                copyBtn.style.backgroundColor = "#333";
                
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.backgroundColor = "#000";
                }, 2000);
            });
        });
    </script>
</body>
</html>
